name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build embedded frontend
        run: npm run build

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify module files
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Vet backend
        run: go vet ./...

      - name: Test backend without CGO
        env:
          CGO_ENABLED: '0'
        run: go test ./...

      - name: Race-test backend
        run: go test -race ./...

      - name: Build production binary for browser tests
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w -X main.version=e2e -X main.commit=${GITHUB_SHA}" -o build/e2e/sub2api-auto5h ./cmd/sub2api-auto5h

      - name: Install Playwright Chromium
        run: npm exec --workspace web playwright install --with-deps chromium

      - name: Test production panel
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-diagnostics
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Build embedded frontend
        run: npm ci && npm run build

      - name: Cross-compile and package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for arch in amd64 arm64; do
            stage="dist/stage-$arch"
            mkdir -p "$stage"
            if [ "$arch" = amd64 ]; then
              export GOAMD64=v1
              unset GOARM64 || true
            else
              export GOARM64=v8.0
              unset GOAMD64 || true
            fi
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$version -X main.commit=$GITHUB_SHA" \
              -o "$stage/sub2api-auto5h" ./cmd/sub2api-auto5h
            cp packaging/sub2api-auto5h.service packaging/sub2api-auto5h.env.example \
              scripts/install.sh README.md LICENSE SECURITY.md THIRD_PARTY_NOTICES.md "$stage/"
            chmod 0755 "$stage/sub2api-auto5h" "$stage/install.sh"
            tar -C "$stage" -czf "dist/sub2api-auto5h-linux-$arch.tar.gz" .
            go version -m "$stage/sub2api-auto5h"
          done
          file dist/stage-amd64/sub2api-auto5h dist/stage-arm64/sub2api-auto5h
          if ldd dist/stage-amd64/sub2api-auto5h 2>&1 | grep -v "not a dynamic executable"; then
            echo "amd64 binary is unexpectedly dynamically linked" >&2
            exit 1
          fi
          dist/stage-amd64/sub2api-auto5h version
          (cd dist && sha256sum sub2api-auto5h-linux-*.tar.gz > SHA256SUMS)
          rm -rf dist/stage-amd64 dist/stage-arm64

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
